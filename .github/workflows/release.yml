# A release: push a tag vX.Y.Z (the compiler's SLOPPY_VERSION) and this builds, tests and publishes
# sloppy-linux-x86_64.tar.gz (what tools/install.sh installs), sloppy-windows-x86_64.zip
# (tools/install.ps1), their checksums and the editor extension.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the compiler (C bootstrap -> Sloppy, which compiles itself)
        run: tools/bootstrap.sh
      - name: Test
        run: |
          python3 tools/runtests.py
          python3 tools/runtests.py --compiler sloppy
          python3 tools/runtests.py --compiler sloppy --release
          python3 tools/runtests.py --compiler sloppy --target wasm
          python3 tools/runtests.py --compiler sloppy --target wasm --release
          python3 tools/lsptest.py
          python3 tools/rendertest.py --no-gpu
      - name: Keep the rendered frames (when a test failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frames
          path: /tmp/sloppy-render/*.png
      - name: Package
        run: python3 tools/release.py --tag "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Sloppy ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Install or upgrade (or run \`sloppy update\`): on Linux \`curl -fsSL https://sloppy-lang.org/install | bash\`; on Windows, in PowerShell, \`irm https://sloppy-lang.org/install.ps1 | iex\`" \
            build/release/*
      # The editor extension, to the VS Code Marketplace and Open VSX (each only once its token is
      # a repository secret: VSCE_PAT, OVSX_PAT; a version already there is left alone)
      - name: Publish the extension to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath build/release/sloppy-*.vsix --skip-duplicate
      - name: Publish the extension to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish -i build/release/sloppy-*.vsix -p "$OVSX_PAT" --skip-duplicate
