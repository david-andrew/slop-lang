# Build Jot's website (home page, docs, playground) and publish it with GitHub Pages.
# (Repository settings -> Pages -> Source: GitHub Actions.)
name: Website
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler (C bootstrap -> Jot, which compiles itself)
        run: tools/bootstrap.sh
      - name: Build the site
        run: python3 tools/site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
