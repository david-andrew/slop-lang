# The tests, on every push and pull request.
name: Tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the compiler (C bootstrap -> Jot, which compiles itself)
        run: tools/bootstrap.sh
      - name: Test
        run: |
          python3 tools/runtests.py
          python3 tools/runtests.py --compiler jot
          python3 tools/runtests.py --compiler jot --release
          python3 tools/runtests.py --compiler jot --target wasm
          python3 tools/lsptest.py
          python3 tools/rendertest.py --no-gpu
      - name: Keep the rendered frames (when a test failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frames
          path: /tmp/jot-render/*.png
