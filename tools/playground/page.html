<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jot playground</title>
<style>
:root {
  color-scheme: dark;
  --bg: #16171b; --panel: #1d1f24; --line: #2b2e35; --text: #d8dade; --dim: #8b9099;
  --accent: #6cb6ff; --run: #3fa66b; --err: #ff7b72;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: 0.02em; }
header h1 span { color: var(--accent); }
select, button { font: inherit; color: var(--text); background: #2a2d34; border: 1px solid #3a3e47; border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: #565c68; }
button.run { background: var(--run); border-color: var(--run); color: white; font-weight: 600; padding: 5px 16px; }
button.run:disabled { opacity: 0.6; cursor: wait; }
#status { color: var(--dim); font-size: 13px; margin-left: auto; white-space: nowrap; }
#status.err { color: var(--err); }
main { flex: 1; display: flex; min-height: 0; }
#left { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
#right { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; background: #111; }
#editor { flex: 1; position: relative; display: flex; min-height: 0; overflow: hidden; }
#gutter { padding: 12px 8px 12px 12px; color: #5c6370; text-align: right; font: 14px/1.5 var(--mono); user-select: none; white-space: pre; overflow: hidden; background: var(--bg); }
#code { position: relative; flex: 1; min-width: 0; }
#code pre, #code textarea { position: absolute; inset: 0; margin: 0; padding: 12px; border: 0; font: 14px/1.5 var(--mono); tab-size: 4; white-space: pre; overflow: auto; }
#code pre { pointer-events: none; color: var(--text); }
#code textarea { background: transparent; color: transparent; caret-color: #fff; resize: none; outline: none; }
#code textarea::selection { background: rgba(108, 182, 255, 0.28); color: transparent; }
#msgs { max-height: 30%; overflow: auto; border-top: 1px solid var(--line); background: var(--panel); font: 13px/1.5 var(--mono); padding: 8px 12px; white-space: pre-wrap; display: none; }
#msgs .e { color: var(--err); cursor: pointer; }
#msgs .e:hover { text-decoration: underline; }
iframe { flex: 1; border: 0; width: 100%; background: #111; }
#hint { color: var(--dim); font-size: 12px; padding: 6px 12px; border-top: 1px solid var(--line); }
kbd { font: 11px var(--mono); border: 1px solid #444; border-radius: 3px; padding: 0 4px; color: var(--text); }
a { color: var(--accent); }
.errline { background: rgba(255, 123, 114, 0.18); display: inline-block; width: 100%; }
/* syntax */
.c { color: #7f848e; font-style: italic; }
.k { color: #c678dd; }
.s { color: #98c379; }
.n { color: #d19a66; }
.t { color: #e5c07b; }
.f { color: #61afef; }
.d { color: #61afef; font-weight: 600; }
.v { color: #56b6c2; }
.o { color: #abb2bf; }
.i { color: #e06c75; }
@media (max-width: 800px) { main { flex-direction: column; } #left { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1><span>Jot</span> playground</h1>
  <select id="examples" title="Examples"></select>
  <button class="run" id="run" title="Run (ctrl+enter)">&#9654; Run</button>
  <button id="stop" title="Stop the program">&#9632; Stop</button>
  <button id="share" title="Copy a link to this program">Share</button>
  <span id="status">loading the compiler&hellip;</span>
</header>
<main>
  <section id="left">
    <div id="editor">
      <div id="gutter">1</div>
      <div id="code"><pre id="hl" aria-hidden="true"></pre><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Jot source"></textarea></div>
    </div>
    <div id="msgs"></div>
  </section>
  <section id="right">
    <iframe id="out" title="Program output" sandbox="allow-scripts allow-pointer-lock allow-popups" allow="fullscreen *; autoplay *; gamepad *; clipboard-write *"></iframe>
    <div id="hint">The compiler runs in this page (compiled to WebAssembly). <kbd>ctrl</kbd>+<kbd>enter</kbd> runs. Click the output to give it the keyboard.</div>
  </section>
</main>
<script>
const JOT_COMPILER = "/*JOT_COMPILER*/";
const JOT_LIB = "/*JOT_LIB*/";
const JOT_EXAMPLES = /*JOT_EXAMPLES*/;
</script>
<script>
/*JOT_HIGHLIGHT*/
</script>
<script id="host-src">
/*JOT_HOST*/
</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const src = $("src"), hl = $("hl"), gutter = $("gutter"), msgs = $("msgs"), statusEl = $("status"), out = $("out");

// ---- syntax highlighting: highlight.js ----
const highlight = jotHighlight;

let errLine = 0;
function refresh() {
  hl.innerHTML = highlight(src.value, errLine);
  const n = src.value.split("\n").length;
  let g = "";
  for (let i = 1; i <= n; i++) g += i + "\n";
  gutter.textContent = g;
  syncScroll();
}
function syncScroll() {
  hl.scrollTop = src.scrollTop;
  hl.scrollLeft = src.scrollLeft;
  gutter.scrollTop = src.scrollTop;
}
src.addEventListener("scroll", syncScroll);
let saveTimer = 0;
src.addEventListener("input", () => {
  if (errLine) errLine = 0;
  refresh();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => localStorage.setItem("jot-playground-source", src.value), 400);
});

// ---- editing: indentation ----
function lineStartOf(pos) { return src.value.lastIndexOf("\n", pos - 1) + 1; }
function replaceRange(a, b, text, selA, selB) {
  src.setSelectionRange(a, b);
  if (!document.execCommand("insertText", false, text)) {
    src.setRangeText(text, a, b, "end");
    src.dispatchEvent(new Event("input"));
  }
  if (selA !== undefined) src.setSelectionRange(selA, selB);
}
src.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "Enter" || e.key === "s")) {
    e.preventDefault();
    run();
    return;
  }
  const v = src.value, a = src.selectionStart, b = src.selectionEnd;
  if (e.key === "Tab") {
    e.preventDefault();
    if (a === b && !e.shiftKey) { replaceRange(a, b, "    "); return; }
    // indent or dedent the selected lines
    const s = lineStartOf(a);
    const block = v.slice(s, b);
    const lines = block.split("\n");
    const changed = lines.map((l) => e.shiftKey ? l.replace(/^ {1,4}/, "") : (l.length ? "    " + l : l)).join("\n");
    replaceRange(s, b, changed, s, s + changed.length);
    return;
  }
  if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    const s = lineStartOf(a);
    const line = v.slice(s, a);
    let indent = line.match(/^\s*/)[0];
    const code = line.replace(/#.*$/, "").trimEnd();
    if (code.endsWith(":")) indent += "    ";
    replaceRange(a, b, "\n" + indent);
    return;
  }
  if (e.key === "Backspace" && a === b && a > 0) {
    // (in indentation: back to the previous level)
    const s = lineStartOf(a);
    const before = v.slice(s, a);
    if (before.length > 0 && /^ +$/.test(before)) {
      e.preventDefault();
      const n = ((before.length - 1) % 4) + 1;
      replaceRange(a - n, a, "");
    }
  }
});

// ---- examples ----
const exSel = $("examples");
for (const name of Object.keys(JOT_EXAMPLES)) {
  const o = document.createElement("option");
  o.value = name;
  o.textContent = name;
  exSel.appendChild(o);
}
exSel.addEventListener("change", () => {
  src.value = JOT_EXAMPLES[exSel.value];
  errLine = 0;
  refresh();
  localStorage.setItem("jot-playground-source", src.value);
  run();
});

// ---- sharing: the program, compressed, in the address ----
async function deflate(text) {
  const s = new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const b = new Uint8Array(await new Response(s).arrayBuffer());
  let bin = "";
  for (const x of b) bin += String.fromCharCode(x);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function inflate(code) {
  const b64 = code.replace(/-/g, "+").replace(/_/g, "/");
  const b = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const s = new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new TextDecoder().decode(await new Response(s).arrayBuffer());
}
$("share").addEventListener("click", async () => {
  const url = location.href.split("#")[0] + "#code=" + await deflate(src.value);
  history.replaceState(null, "", url);
  try { await navigator.clipboard.writeText(url); setStatus("link copied"); }
  catch (e) { setStatus("the link is in the address bar"); }
});

// ---- compiling and running ----
let worker = null, ready = false, nextId = 1;
const waiting = new Map();
function setStatus(text, err) {
  statusEl.textContent = text;
  statusEl.className = err ? "err" : "";
}
async function startCompiler() {
  const hostSrc = $("host-src").textContent;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([hostSrc], { type: "text/javascript" })));
    await new Promise((resolve, reject) => {
      worker.onmessage = (ev) => {
        if (ev.data.ready) { resolve(); return; }
        const w = waiting.get(ev.data.id);
        if (w) { waiting.delete(ev.data.id); w(ev.data); }
      };
      worker.onerror = (e) => reject(e);
      worker.postMessage({ init: [JOT_COMPILER, JOT_LIB] });
    });
  } catch (e) {
    // (no worker here: the compiler runs on the page; host-src defined jotHost here too)
    worker = null;
    await jotHost.init(JOT_COMPILER, JOT_LIB);
  }
  ready = true;
}
function compile(source) {
  if (!worker) return Promise.resolve(jotHost.compile(source));
  const id = nextId++;
  return new Promise((resolve) => {
    waiting.set(id, resolve);
    worker.postMessage({ id, source });
  });
}
async function run() {
  if (!ready) return;
  $("run").disabled = true;
  setStatus("compiling…");
  const r = await compile(src.value);
  $("run").disabled = false;
  showMessages(r.log);
  if (!r.ok) {
    setStatus("errors", true);
    return;
  }
  setStatus(`compiled in ${Math.round(r.ms)} ms`);
  out.srcdoc = r.html;
}
function showMessages(log) {
  msgs.innerHTML = "";
  errLine = 0;
  const text = log.trimEnd();
  msgs.style.display = text ? "block" : "none";
  for (const l of text.split("\n")) {
    const div = document.createElement("div");
    const m = l.match(/^\/play\/main\.jot:(\d+):(\d+): (error|warning): (.*)$/);
    if (m) {
      div.className = "e";
      div.textContent = `line ${m[1]}: ${m[3]}: ${m[4]}`;
      const line = Number(m[1]), col = Number(m[2]);
      if (!errLine && m[3] === "error") errLine = line;
      div.addEventListener("click", () => goTo(line, col));
    } else div.textContent = l.replace(/\/play\/main\.jot/g, "main.jot").replace(/\/jot\/lib\//g, "lib/");
    msgs.appendChild(div);
  }
  refresh();
}
function goTo(line, col) {
  const lines = src.value.split("\n");
  let p = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) p += lines[i].length + 1;
  p += Math.max(0, col - 1);
  src.focus();
  src.setSelectionRange(p, p);
  const lh = parseFloat(getComputedStyle(src).lineHeight);
  src.scrollTop = Math.max(0, (line - 5) * lh);
}
$("run").addEventListener("click", run);
$("stop").addEventListener("click", () => { out.srcdoc = "<body style='background:#111'></body>"; setStatus("stopped"); });

// ---- start ----
(async () => {
  let text = null;
  const m = location.hash.match(/#code=([A-Za-z0-9_-]+)/);
  if (m) { try { text = await inflate(m[1]); } catch (e) { text = null; } }
  if (text === null) text = localStorage.getItem("jot-playground-source");
  if (text === null) text = JOT_EXAMPLES[Object.keys(JOT_EXAMPLES)[0]];
  src.value = text;
  refresh();
  try {
    await startCompiler();
    setStatus("ready");
    run();
  } catch (e) {
    setStatus("the compiler could not start: " + (e && e.message || e), true);
  }
})();
</script>
</body>
</html>
